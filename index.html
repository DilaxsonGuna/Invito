<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Special Countdown!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="countdown-container">
        <h1 class="title">Our Special Day Is Coming! ❤️</h1>
        <p class="event-description">Counting down to September 26, 2025, 6:00 PM Toronto Time</p>

        <div class="countdown-timer">
            <div class="time-box">
                <span id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div class="current-time-zones">
            <div class="timezone-box">
                <p>Your Time (Italy):</p>
                <p class="current-time" id="italy-time"></p>
            </div>
            <div class="timezone-box">
                <p>Her Time (Canada - Toronto):</p>
                <p class="current-time" id="canada-time"></p>
            </div>
        </div>

        <p class="footer-note">Can't wait to be together!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
